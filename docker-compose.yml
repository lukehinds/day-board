services:
  day-board:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"   # reachable on the LAN IP and the Tailscale IP
    volumes:
      - board-data:/data
      - ./backups:/backups

volumes:
  board-data:

# Nightly backup from the host's crontab:
#   30 2 * * * cd /opt/day-board && docker compose exec -T day-board node backup.mjs
